<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuzlocke - Compteurs</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/common.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent !important;
            margin: 0;
            padding: 8px;
            overflow: hidden;
        }
        .counters { display: flex; gap: 14px; align-items: center; }
        body.vertical .counters { flex-direction: column; align-items: flex-start; }
        .counter {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
        .counter-label {
            color: #e5e7eb;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        .counter-value {
            font-weight: 900;
            font-size: 28px;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.9);
        }
        .bump { animation: bump 0.5s ease-out; }
        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="counters" class="counters"></div>

    <script>
        const socket = io();
        // Options OBS : ?show=deaths,captures,badges,attempts&layout=vertical&scale=1.5
        const OPTIONS = parseOverlayParams(location.search);
        if (OPTIONS.layout === 'vertical') document.body.classList.add('vertical');
        if (OPTIONS.scale !== 1) document.body.style.zoom = OPTIONS.scale;

        const DEFINITIONS = {
            deaths: { label: 'Morts', color: '#ef4444' },
            captures: { label: 'Captures', color: '#4ade80' },
            badges: { label: 'Badges', color: '#facc15' },
            attempts: { label: 'Tentative', color: '#38bdf8' }
        };
        const keys = OPTIONS.show.filter(k => DEFINITIONS[k]);
        const container = document.getElementById('counters');
        container.innerHTML = keys.map(k => `
            <div class="counter">
                <span class="counter-label">${DEFINITIONS[k].label}</span>
                <span class="counter-value" id="value-${k}" style="color: ${DEFINITIONS[k].color}">0</span>
            </div>`).join('');

        function update(state) {
            const counters = getCounters(state);
            for (const k of keys) {
                const el = document.getElementById(`value-${k}`);
                const value = String(k === 'attempts' ? `#${counters[k]}` : counters[k]);
                if (el.textContent === value) continue;
                el.textContent = value;
                el.classList.remove('bump');
                void el.offsetWidth;
                el.classList.add('bump');
            }
        }

        socket.on('init', data => update(data.state));
        socket.on('state_updated', update);
    </script>
</body>
</html>
