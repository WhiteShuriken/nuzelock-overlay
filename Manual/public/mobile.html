<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Nuzlocke - Télécommande</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans pb-24">
    <header class="sticky top-0 z-30 bg-gray-900/95 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center justify-between">
        <h1 class="font-black text-blue-400">🎮 Télécommande</h1>
        <div class="flex items-center gap-2">
            <span id="conn-dot" class="w-3 h-3 rounded-full bg-yellow-400" title="Connexion au serveur"></span>
            <button id="undo-btn" onclick="undoLastAction()" class="hidden bg-yellow-600 active:bg-yellow-700 px-3 py-1.5 rounded-lg text-sm font-bold">⏪ Annuler</button>
        </div>
    </header>
    <div id="conn-banner" class="hidden bg-red-600 text-center text-sm font-bold py-2">⚠️ Serveur déconnecté</div>

    <main class="p-4 space-y-5 max-w-md mx-auto">
        <section id="counters" class="grid grid-cols-2 gap-2"></section>

        <section>
            <h2 class="text-sm font-bold text-yellow-400 mb-2">Équipe</h2>
            <div id="team" class="space-y-2"></div>
        </section>

        <section>
            <h2 class="text-sm font-bold text-green-400 mb-2">⚡ Capture rapide</h2>
            <form id="capture-form" onsubmit="quickCapture(event)" class="bg-gray-800 rounded-xl p-3 space-y-2">
                <input id="q-spec" list="pokemon-list" placeholder="Espèce (Français)" autocomplete="off" class="w-full bg-gray-900 px-3 py-2.5 rounded-lg border border-gray-700 text-base outline-none focus:border-green-500">
                <input id="q-nick" placeholder="Surnom (optionnel)" autocomplete="off" class="w-full bg-gray-900 px-3 py-2.5 rounded-lg border border-gray-700 text-base outline-none focus:border-green-500">
                <div class="grid grid-cols-3 gap-2">
                    <input id="q-level" type="number" inputmode="numeric" min="1" max="100" placeholder="Niv." class="bg-gray-900 px-3 py-2.5 rounded-lg border border-gray-700 text-base outline-none focus:border-green-500">
                    <input id="q-route" list="route-list" placeholder="Lieu de capture" autocomplete="off" class="col-span-2 bg-gray-900 px-3 py-2.5 rounded-lg border border-gray-700 text-base outline-none focus:border-green-500">
                </div>
                <div class="flex items-center justify-between gap-2">
                    <select id="q-gender" class="bg-gray-900 px-2 py-2.5 rounded-lg border border-gray-700 text-base">
                        <option value="None">⚪</option>
                        <option value="M">♂️</option>
                        <option value="F">♀️</option>
                    </select>
                    <label class="flex items-center gap-1 text-yellow-400 font-bold"><input type="checkbox" id="q-shiny" class="w-5 h-5 accent-yellow-500"> ✨ Shiny</label>
                    <button type="submit" class="bg-green-600 active:bg-green-700 px-5 py-2.5 rounded-lg font-bold">➕ Ajouter</button>
                </div>
            </form>
        </section>

        <section>
            <h2 class="text-sm font-bold text-red-400 mb-2">⚰️ Dernières morts</h2>
            <div id="cemetery" class="space-y-1.5"></div>
        </section>
    </main>

    <datalist id="pokemon-list"></datalist>
    <datalist id="route-list"></datalist>

    <div id="death-sheet" class="hidden fixed inset-0 z-40 bg-black/70 flex items-end">
        <form onsubmit="confirmDeath(event)" class="w-full bg-gray-800 rounded-t-2xl p-5 space-y-3 border-t border-red-500/40">
            <h2 class="text-lg font-black text-red-400">⚰️ <span id="death-name"></span></h2>
            <input id="death-level" type="number" inputmode="numeric" min="1" max="100" placeholder="Niveau" class="w-full bg-gray-900 px-3 py-3 rounded-lg border border-gray-700 text-base outline-none focus:border-red-500">
            <input id="death-cause" placeholder="Cause de la mort (optionnel)" class="w-full bg-gray-900 px-3 py-3 rounded-lg border border-gray-700 text-base outline-none focus:border-red-500">
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="closeDeathSheet()" class="bg-gray-700 active:bg-gray-600 py-3 rounded-lg font-bold">Annuler</button>
                <button type="submit" class="bg-red-600 active:bg-red-700 py-3 rounded-lg font-bold">Graver dans la pierre</button>
            </div>
        </form>
    </div>

    <div id="toast" class="hidden fixed bottom-4 inset-x-4 z-50 px-4 py-3 rounded-xl text-sm font-bold text-center shadow-2xl"></div>

    <script src="/js/common.js"></script>
    <script src="/js/mobile.js"></script>
</body>
</html>
